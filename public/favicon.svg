<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="V3 Transport">
  <!-- Brand-dark tile. A solid tile beats a bare glyph in a browser tab, which
       may sit against light or dark chrome. -->
  <rect width="64" height="64" rx="14" fill="#030712"/>

  <!-- Side-view coach. Deliberately chunky: at 16px anything finer than about
       2px disappears, so only body, window strip and wheels are kept. -->
  <rect x="9" y="15" width="46" height="28" rx="6" fill="#F4EDE4"/>

  <!-- One long window strip broken by pillars reads as a bus far faster than
       separate small squares once scaled down. -->
  <rect x="14" y="20" width="28" height="11" rx="2" fill="#030712"/>
  <rect x="23.5" y="20" width="2.5" height="11" fill="#F4EDE4"/>
  <rect x="32.5" y="20" width="2.5" height="11" fill="#F4EDE4"/>

  <!-- Destination blind, in the brand orange -->
  <rect x="45" y="20" width="6" height="11" rx="2" fill="#FB3B17"/>

  <!-- Skirt line, to stop the lower body reading as a plain slab -->
  <rect x="14" y="36" width="36" height="2.5" rx="1.25" fill="#030712" opacity="0.25"/>

  <!-- Wheels -->
  <circle cx="20" cy="45" r="7" fill="#030712"/>
  <circle cx="20" cy="45" r="3.4" fill="#F4EDE4"/>
  <circle cx="45" cy="45" r="7" fill="#030712"/>
  <circle cx="45" cy="45" r="3.4" fill="#F4EDE4"/>
</svg>
